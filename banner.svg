<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Sehat Saathi - Urdu-first AI Health Navigator" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021a1a"/>
      <stop offset="1" stop-color="#052e3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#34d399" opacity="0.6">
    <circle cx="80" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="240" r="4"><animate attributeName="cy" values="240;215;240" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="70" r="2.5"><animate attributeName="cy" values="70;50;70" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="250" r="2.5"><animate attributeName="cy" values="250;228;250" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ECG heartbeat line -->
  <polyline points="0,230 180,230 215,230 235,185 255,265 275,205 295,230 520,230 555,230 575,170 595,275 620,215 640,230 1000,230"
            fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1400" stroke-dashoffset="1400" filter="url(#glow)" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="1400;0;0;-1400" keyTimes="0;0.45;0.6;1" dur="5s" repeatCount="indefinite"/>
  </polyline>

  <!-- medical cross, pulsing -->
  <g transform="translate(110,120)" filter="url(#glow)">
    <rect x="-14" y="-40" width="28" height="80" rx="6" fill="#34d399"/>
    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#34d399"/>
    <animateTransform attributeName="transform" type="translate" values="110,120;110,112;110,120" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="190" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="url(#title)" filter="url(#glow)">SEHAT SAATHI</text>
  <text x="193" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="8" fill="#a7f3d0">URDU-FIRST AI HEALTH NAVIGATOR</text>
  <text x="193" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#67e8f9" opacity="0.9">Understand your prescription. In your language. By voice.</text>

  <!-- pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ecfeff" text-anchor="middle">
    <rect x="190" y="248" width="120" height="30" rx="15" fill="#0f766e" opacity="0.7"/><text x="250" y="268">SDG 3</text>
    <rect x="325" y="248" width="120" height="30" rx="15" fill="#0e7490" opacity="0.7"/><text x="385" y="268">Voice-First</text>
    <rect x="460" y="248" width="120" height="30" rx="15" fill="#1d4ed8" opacity="0.7"/><text x="520" y="268">Live AI</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
