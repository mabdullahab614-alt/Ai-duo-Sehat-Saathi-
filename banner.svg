<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Sehat Saathi: Urdu-first AI prescription and lab report reader</title>
  <desc id="d">Animated banner with a heartbeat line, floating medicine capsules and a rotating tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141C"/>
      <stop offset="0.55" stop-color="#0B3B3F"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5EEAD4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="380" rx="24"/></clipPath>
    <clipPath id="capshape"><rect x="-44" y="-17" width="88" height="34" rx="17"/></clipPath>
    <g id="cap">
      <g clip-path="url(#capshape)">
        <rect x="-44" y="-17" width="44" height="34" fill="#14B8A6"/>
        <rect x="0" y="-17" width="44" height="34" fill="#FDBA74"/>
        <rect x="-44" y="-17" width="88" height="10" fill="#fff" fill-opacity="0.18"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- soft moving glow -->
    <circle cx="200" cy="120" r="180" fill="#5EEAD4" fill-opacity="0.07">
      <animate attributeName="cx" values="200;320;200" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating capsules -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="5s" repeatCount="indefinite"/>
      <use href="#cap" transform="translate(1010 80) rotate(35)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="6.5s" repeatCount="indefinite"/>
      <use href="#cap" transform="translate(1120 170) rotate(-30) scale(0.8)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="7s" repeatCount="indefinite"/>
      <use href="#cap" transform="translate(900 140) rotate(70) scale(0.65)" opacity="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="4.5s" repeatCount="indefinite"/>
      <use href="#cap" transform="translate(1150 60) rotate(10) scale(0.5)" opacity="0.7"/>
    </g>

    <!-- Rx mark -->
    <text x="62" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#5EEAD4" filter="url(#glow)">℞
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- title -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-50 0;0 0" dur="0.9s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      <text x="240" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Sehat Saathi</text>
      <text x="242" y="222" font-family="'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',serif" font-size="46" fill="#5EEAD4">صحت ساتھی</text>
    </g>

    <!-- rotating tagline -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#CFFAFE">
      <text x="242" y="274" opacity="0">Photo kheenchein. Parchi samajh jayein.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="10.5s" repeatCount="indefinite"/>
      </text>
      <text x="242" y="274" opacity="0">Urdu voice, daily schedule, instant safety net.
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="10.5s" repeatCount="indefinite"/>
      </text>
      <text x="242" y="274" opacity="0">Safety rules that override the AI.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.96;1" dur="10.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tag -->
    <g transform="translate(242 304)">
      <rect width="330" height="30" rx="15" fill="#0B1F2A" fill-opacity="0.7" stroke="#5EEAD4" stroke-opacity="0.5"/>
      <text x="165" y="20" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5EEAD4" letter-spacing="1.5">UN SDG 3  ·  STCS AI HACKATHON 2026</text>
    </g>

    <!-- ECG base line -->
    <path d="M0 335 H830 L850 335 L862 318 L874 348 L892 250 L912 372 L928 320 L942 335 H1200" fill="none" stroke="#5EEAD4" stroke-opacity="0.18" stroke-width="3" stroke-linejoin="round"/>
    <!-- ECG travelling pulse -->
    <path d="M0 335 H830 L850 335 L862 318 L874 348 L892 250 L912 372 L928 320 L942 335 H1200" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="240 760" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="240;-1000" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <!-- heartbeat ring -->
    <circle cx="892" cy="335" r="6" fill="none" stroke="#FDBA74" stroke-width="2">
      <animate attributeName="r" values="6;46" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
