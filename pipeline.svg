<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Sehat Saathi AI pipeline</title>
  <desc id="d">Scan, OCR, safety engine, structured extraction, human confirmation, then Urdu explanation, voice and schedule. The safety engine can branch to an emergency screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141C"/>
      <stop offset="1" stop-color="#0B2E33"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5EEAD4" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="330" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>

    <text x="600" y="38" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#5EEAD4">HOW A PRESCRIPTION BECOMES UNDERSTANDING</text>

    <!-- flow line -->
    <line x1="25" y1="130" x2="1175" y2="130" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- travelling data dots -->
    <circle r="6" fill="#FDBA74" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M25 130 H1175"/>
    </circle>
    <circle r="4" fill="#5EEAD4" filter="url(#glow)">
      <animateMotion dur="7s" begin="2.3s" repeatCount="indefinite" path="M25 130 H1175"/>
    </circle>

    <!-- branch to emergency -->
    <line x1="500" y1="170" x2="500" y2="232" stroke="#F87171" stroke-width="2.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <text x="514" y="205" font-size="13" font-weight="700" fill="#F87171">red flag</text>

    <!-- node 1 -->
    <g transform="translate(25 90)">
      <rect width="150" height="80" rx="14" fill="#0B1F2A" stroke="#14B8A6" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">STEP 1</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Scan</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#A7F3D0">photo · PDF · text</text>
    </g>
    <!-- node 2 -->
    <g transform="translate(225 90)">
      <rect width="150" height="80" rx="14" fill="#0B1F2A" stroke="#14B8A6" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">STEP 2</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">OCR</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#A7F3D0">Gemini · Tesseract</text>
    </g>
    <!-- node 3 safety -->
    <g transform="translate(425 90)">
      <rect width="150" height="80" rx="14" fill="#2A0F0F" stroke="#F87171" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FCA5A5">STEP 3</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Safety</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#FECACA">rules, not AI</text>
    </g>
    <!-- node 4 -->
    <g transform="translate(625 90)">
      <rect width="150" height="80" rx="14" fill="#0B1F2A" stroke="#14B8A6" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">STEP 4</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Extract</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#A7F3D0">JSON schema + Zod</text>
    </g>
    <!-- node 5 -->
    <g transform="translate(825 90)">
      <rect width="150" height="80" rx="14" fill="#0B1F2A" stroke="#FDBA74" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FDBA74">STEP 5</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Confirm</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#FED7AA">AI Ka Yaqeen</text>
    </g>
    <!-- node 6 -->
    <g transform="translate(1025 90)">
      <rect width="150" height="80" rx="14" fill="#0B1F2A" stroke="#14B8A6" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">STEP 6</text>
      <text x="75" y="50" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Explain</text>
      <text x="75" y="68" text-anchor="middle" font-size="12" fill="#A7F3D0">Urdu · voice · schedule</text>
    </g>

    <!-- emergency box -->
    <g transform="translate(395 232)">
      <rect width="210" height="56" rx="14" fill="#7F1D1D" stroke="#F87171" stroke-width="2">
        <animate attributeName="fill-opacity" values="1;0.7;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="25" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">EMERGENCY SCREEN</text>
      <text x="105" y="44" text-anchor="middle" font-size="12" fill="#FECACA">instant · no AI wait · 1122</text>
    </g>

    <!-- side note -->
    <text x="900" y="262" text-anchor="middle" font-size="14" fill="#A7F3D0">Nothing is explained until a human confirms the data.</text>
    <text x="900" y="284" text-anchor="middle" font-size="14" fill="#A7F3D0">Nothing is invented. Unclear fields are flagged.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
